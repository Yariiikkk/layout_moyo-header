<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="
        width=device-width,
        user-scalable=no,
        initial-scale=2.0,
        maximum-scale=1.0,
        minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a
          href="#"
          class="logo"
        >
          <img
            src="images/logo.png"
            alt="Moyo logo"
            class="logo__img"
          />
        </a>

        <nav class="nav">
          <a
            href="#"
            class="nav__links is-active"
          >
            Apple
          </a>
          <a
            href="#"
            class="nav__links"
          >
            Samsung
          </a>
          <a
            href="#"
            class="nav__links"
          >
            Smartphones
          </a>
          <a
            href="#"
            class="nav__links link__number__4"
            data-qa="hover"
          >
            Laptops & Computers
          </a>
          <a
            href="#"
            class="nav__links"
          >
            Gadgets
          </a>
          <a
            href="#"
            class="nav__links"
          >
            Tablets
          </a>
          <a
            href="#"
            class="nav__links"
          >
            Photo
          </a>
          <a
            href="#"
            class="nav__links"
          >
            Video
          </a>
        </nav>
      </div>
    </header>
  </body>
</html>
